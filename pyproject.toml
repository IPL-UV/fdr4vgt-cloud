[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdr4vgt-cloud"
version = "1.0.0"
description = "Cloud detection for Proba-V and SPOT-VGT"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Julio Contreras", email = "julio.contreras@uv.es"},
]
keywords = ["cloud detection", "remote sensing", "proba-v", "spot-vgt", "deep learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "rasterio>=1.3",
  "torch>=2.7.0",
  "segmentation-models-pytorch>=0.5.0",
  "pyyaml",
  "typer>=0.12",
  "tqdm",
]

[project.optional-dependencies]
build = [
  "tacotoolbox[docs]==0.26.9",
  "tacoreader==2.4.21",
  "mlstac==0.4.9",
  "rio-cogeo==7.0.4",
  "pyarrow>=21",
  "huggingface_hub>=0.36",
  "safetensors",
]
notebook = [
  "jupyter",
  "nbconvert",
  "matplotlib",
  "scikit-learn",
  "einops",
]
train = [
  "pytorch-lightning>=2.0",
  "scikit-learn",
  "einops",
]
dev = [
  "ruff>=0.7",
  "pytest",
  "pyright",
]

[project.urls]
Homepage = "https://github.com/IPL-UV/fdr4vgt-cloud"
Repository = "https://github.com/IPL-UV/fdr4vgt-cloud"
Issues = "https://github.com/IPL-UV/fdr4vgt-cloud/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fdr4vgt_cloud"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["local_tests"]
