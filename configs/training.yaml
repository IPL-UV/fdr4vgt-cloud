# Training hyperparameters.
pretrain:
  batch_size: 32
  learning_rate: 0.001
  max_epochs: 100
  patience: 100
  scheduler_step: 100
  scheduler_gamma: 0.1
  optimizer: Adam
  loss: BCEWithLogitsLoss

finetune:
  batch_size: 16
  learning_rate: 0.001
  max_epochs: 30
  patience: 10
  scheduler_step: 100
  scheduler_gamma: 0.1
  optimizer: Adam
  loss: BCEWithLogitsLoss

evaluation:
  threshold: 0.5
  patch_size: 512
  overlap: 128
